[book]
title = "qpl"
authors = ["Nick Elgueta"]
language = "en"
description = "Quick Polars Language — a kdb+/q-inspired CLI language that compiles to Polars lazy frames."
src = "src"

[output.html]
git-repository-url = "https://github.com/nicelgueta/qpl"
edit-url-template = "https://github.com/nicelgueta/qpl/edit/main/book/{path}"
default-theme = "light"
preferred-dark-theme = "navy"
additional-js = ["theme/qpl-highlight.js"]

[output.html.fold]
enable = true
level = 1
